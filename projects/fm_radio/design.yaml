# FM radio + Bluetooth speaker with OLED (channel + local time), USB-C charging.
# Single source of truth: written/edited by Claude, compiled by aipcb into schematic + PCB.
project: fm_radio
title: "FM/BT Pocket Radio"
rev: A
company: aipcb
notes: |
  Architecture
  - ESP32-WROOM-32E: Bluetooth Classic A2DP sink (phone -> speaker), WiFi NTP time sync, UI, I2C master.
  - RDA5807M FM tuner on I2C (0x10/0x11). Reference clock = 32.768 kHz from PCF8563 CLKOUT (open drain, 10k pull-up).
  - PCF8563 RTC (0x51) keeps local time; backed by CR1220 through BAT54C diode-OR. Time is set by NTP when WiFi is available.
  - 0.96" SSD1306 OLED module (0x3C) on a 4-pin header: shows frequency / BT state + clock.
  - Audio: FM L+R and ESP32 DAC1 (IO25, BT audio) are summed by 10k resistors, RC-filtered (fc ~22 kHz),
    AC-coupled into a PAM8302 class-D mono amplifier driving an 8 ohm / 1 W speaker. AMP_SD (IO26) mutes/powers down the amp.
  - Power: USB-C (5.1k CC pull-downs = 5 V sink) -> MCP73831 1S Li-ion charger, 500 mA (Rprog 2k).
    Load sharing: VBUS via Schottky to VSYS; battery via AO3401A P-FET driven by an LTC4412 ideal-diode
    controller (FET off while VSYS > VBAT, on within microseconds when USB is pulled: no brown-out dip).
    VSYS -> AP2112K-3.3 (600 mA) -> +3V3. Slide switch drives the LDO enable (power on/off). PAM8302 runs from VSYS.
  - Programming: CH340C USB-UART at 3.3 V with classic DTR/RTS auto-reset transistors; RESET and BOOT buttons.
  - User controls: UP / DOWN / MODE buttons (ESP32 internal pull-ups). Battery voltage on IO34 via 100k/100k divider.

board:
  width: 80
  height: 60
  corner_radius: 3
  layers: 2
  thickness: 1.6
  fab: jlcpcb

rules:
  track: 0.2
  power_track: 0.4
  clearance: 0.2
  via: [0.6, 0.3]
  grid: 0.1
  edge_clearance: 0.4
  part_spacing: 0.4
  power_nets: [VBUS, VBAT, VSYS, "+3V3", SPK_P, SPK_N]
  route_first: [USB_DP, USB_DN]

custom_symbols:
  lib: aipcb_custom
  parts:
    RDA5807M:
      ref: U
      footprint: Package_SO:MSOP-10_3x3mm_P0.5mm
      description: "Single-chip broadcast FM stereo radio tuner, I2C, MSOP-10. Pinout verified 2026-11-13 against RDA5807M datasheet Rev.1.0 Fig.7-1 / Table 7-1: 1 GND, 2 FM_IN, 3 GND, 4 SCLK, 5 SDIO, 6 RCLK, 7 VDD, 8 GND, 9 ROUT, 10 LOUT (the earlier AI pinout had pins 1/2/4/5 wrong)."
      datasheet: "https://cdn-shop.adafruit.com/product-files/5651/5651_tuner84_RDA5807M_datasheet_v1.pdf"
      keywords: "FM radio tuner I2C"
      pins:
        - [5, SDIO, bidirectional, left]
        - [4, SCLK, input, left]
        - [2, FMIN, input, left]
        - [6, RCLK, input, left]
        - [7, VDD, power_in, right]
        - [10, LOUT, output, right]
        - [9, ROUT, output, right]
        - [1, GND, power_in, bottom]
        - [3, GND, passive, bottom]
        - [8, GND, passive, bottom]

