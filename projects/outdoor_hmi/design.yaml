    - {id: SR-02, text: "雙模智慧鬧鐘：震動模式 / 廣播音喚醒模式（含 1 秒 Fail-safe）", scope: "Board 2 + 韌體", priority: 必要, design: "見 FR-07、FR-11、FR-12", verify: "實機"}
    - {id: SR-03, text: "SOS 第一級本地警報：喇叭最大功率約 100 dB 蜂鳴 + LED 摩斯碼", scope: Board 2, priority: 必要, design: "見 FR-06、FR-08、FR-10", verify: "聲壓計量測"}
    - {id: SR-04, text: "SOS 第二 / 三級：FRS 語音求救、每 5 分鐘 APRS 座標", scope: Board 1, priority: 必要, design: "Board 2 提供 SOS_PRESS / SOS_LONG 喚醒訊號", verify: "Board 1 測試"}
    - {id: SR-05, text: "DAB / DAB+ / FM 廣播與 DLS / RDS 文字", scope: Board 1, priority: 必要, design: "Board 2 只負責音訊放大（AUDIO_P/N 差動輸入）", verify: "Board 1 測試"}
