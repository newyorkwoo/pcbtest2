# Outdoor Hub — Board 2: HMI & Alarm board.
# Connects to Board 1 (AP + GNSS + RF) through a 26-pin 0.5 mm FPC.
# Single source of truth: written/edited by Claude, compiled by aipcb into schematic + PCB.
project: outdoor_hmi
title: "Outdoor Hub — HMI & Alarm Board (Board 2)"
rev: A
company: aipcb
notes: |
  Scope
  - Board 2 of the All-in-One Outdoor Hub: 5 front keys, encoder (rotate + push), SOS key with a hardware
    3-second long-press qualifier, SOS beacon LED, 2 x LRA haptic drivers, 2.5 W class-D speaker amp.
    Board 1 (AP, GNSS, DAB+/FM, FRS/APRS, PMIC, display) is out of scope: it needs a >=4-layer RF stack-up,
    which this 2-layer flow cannot produce.
  - Operating range target: -40..+85 C. All ICs are -40..+85 C (or wider) grades; resistors are AEC-Q200
    thick film (Yageo AC series); timing / RC / RF caps are C0G, decoupling caps X8R, bulk caps X7R
    (-55..+125 C; X8R is not offered at 10-22 uF). No X5R anywhere. Board gets conformal coating
    (IPC-CC-830 acrylic/urethane) with keep-outs on FPC contacts, switch domes, encoder and JST contacts.

  FPC (J1, Hirose FH12-26S-0.5SH, 0.5 A/contact)
  - VSYS on 4 contacts (2 A budget): worst case SOS = amp 2.5 W (~1.1 A from VSYS at 3.0 V through the boost)
    + LED 0.14 A + 2 x LRA ~0.2 A. GND on 7 contacts + MP; the audio pair is guarded by GND contacts.
  - +3V3 is the always-on logic rail from Board 1 (key expander, I2C switch, SOS timer, pull-ups).
  - Logic I/O are 3.3 V. Every input from Board 1 has a default-safe pull resistor here
    (amp muted, boost off, haptics off, LED off) so a floating FPC/unpowered AP keeps the board silent.

  I2C (single bus, 3.3 V, 400 kHz)
  - 0x21 TCA9554 key expander (A0=1). 0x70 TCA9546A I2C switch (A2..A0=0).
  - The two DRV2605L share the fixed address 0x5A, so each sits on its own TCA9546A channel
    (CH0 = haptic A, CH1 = haptic B). Both IN/TRIG pins share HAPTIC_TRIG so the AP fires both LRAs
    in the same edge (symmetric vibration); both EN pins share HAPTIC_EN (expander P5).
  - Upstream pull-ups R1/R2 4.7k are fitted here; DNP them if Board 1 already pulls the bus up.

  Keys
  - 5 front keys (BACK, MENU, FN, MARK=waymark, PAGE): C&K KSC sealed (IP67) tact switches to GND,
    10k pull-up -> 100k series -> 10 nF C0G (tau ~1 ms RC deglitch + RF filter) -> TCA9554 P0..P4.
    TCA9554 ~INT (open-drain, 10k pull-up) -> KEY_INT_N wakes the AP. Firmware still debounces.
  - Encoder A/B/push go straight to the AP (A/B to a timer in quadrature-decoder mode, x4) through the
    Bourns-recommended 10k pull-up / 10k series / 10 nF filter (tau 0.1 ms; fine up to ~1 kHz edge rate).
  - ESD: SP0504BAHT 4-ch TVS arrays sit on the raw (switch-side) node of every key/encoder line.

  SOS
  - SW7 to +3V3. SOS_RAW has a 10k pull-down; SOS_PRESS (1k + 10 nF) goes to the AP for instant feedback.
  - Long-press qualifier: SOS_RAW -> 910k -> SOS_TMR with 4.7 uF X8R -> 74AUP1G17 Schmitt -> SOS_LONG.
    Trips after ~3 s held (sim 01). On release 1N4148WS dumps SOS_TMR into the 10k pull-down, so short
    presses never accumulate. SOS_LONG is an independent wake/IRQ for the AP/PMIC; firmware also times
    SOS_PRESS, so either path alone can raise the alarm.
  - SOS beacon LED: red 2835 0.5 W, VSYS -> LED -> 2 x 33R (1206, parallel) -> DMG2302U, PWM from AP
    (Morse). ~95 mA at 3.7 V, ~133 mA at 4.35 V; ~150 mA with a min-Vf (1.8 V) part at 4.35 V,
    inside the 200 mA DC rating (sim 03).

  Haptics: 2 x DRV2605L (closed-loop LRA resonance tracking + auto-calibration, compensates temperature drift),
    VDD = VSYS (2..5.2 V), REG and VDD 1 uF each; LRA leads on JST-SH 2-pin.

  Audio (2.5 W / 4 ohm alarm & radio speaker)
  - A 3.0-4.35 V cell cannot reach 2.5 W into 4 ohm BTL without a boost (~1.3 W max), so TPS61022 boosts
    VSYS to AMP_5V (5.0 V, 732k/100k on FB, Vref 0.6 V) and PAM8302A (2.5 W/4 ohm @ 5 V) drives the speaker.
    Chosen over the single-chip TPA2013D1 because every pinout here comes from the stock KiCad library
    (no AI-generated symbols); the TPA2013D1 swap is a possible rev B size optimisation.
  - BOOST_EN (100k pull-down) gates the boost. TPS61022 has true load disconnect (datasheet 7.3.x): with EN low
    AMP_5V = 0 V and PAM8302 is unpowered. AMP_SD_N therefore enters through R40 (10k) so the AP driving it high
    while the amp is unpowered only pushes <0.3 mA into the ~SD ESD diode; R40/R34 = 3.0 V high when powered.
    Firmware order: BOOST_EN high -> wait 2 ms -> AMP_SD_N high; reverse on mute. Hardware mute = AMP_SD_N.
  - TPS61022 verified against TI SLVSF19-class datasheet: pins 1 GND 2 SW 3 VOUT 4 FB 5 EN 6 MODE 7 VIN;
    VREF 585/600/615 mV -> AMP_5V 4.87..5.12 V; MODE low = auto PFM; L 0.33-2.9 uH; COUT >= 10 uF effective
    (IOUT <= 1.5 A); CIN >= 4.7 uF effective; R2 < 300k. 732k/100k is TI's own typical-application divider.
  - Differential input AUDIO_P/N from the AP codec: 100 nF C0G DC block -> 10k -> 100 pF C0G at the amp pins.
    RC low-pass 159 kHz per leg: >60 dB ideal rejection of FRS 467 MHz that couples onto the FPC pair (sim 02).
    High-pass ~80 Hz (protects the small speaker and kills plop).
  - Filterless outputs: ferrite bead + 470 pF C0G per leg against EMI into the GNSS/DAB antennas.

board:
  width: 80
  height: 48
  corner_radius: 3
  layers: 2
  thickness: 1.0
  fab: jlcpcb

rules:
  track: 0.15
  power_track: 0.4
  clearance: 0.15
  via: [0.6, 0.3]
  grid: 0.1
  edge_clearance: 0.4
  part_spacing: 0.4
  # LRA leads stay at 0.2 mm: DRV2605L LRA drive is < 0.1 A rms
  power_nets: [VSYS, AMP_5V, BST_SW, AMP_OUTP, AMP_OUTN, SPK_P, SPK_N, LED_K, LED_D]
  # TPS61022 SW/VOUT pads are 0.2/0.35 mm tall: 0.4 mm cannot enter them, 0.3 mm can (BST_SW is 2 mm long;
  # AMP_5V ~0.7 A avg, 1.1 A peak at 2.5 W). VSYS lands on 0.3 mm FPC pads (0.5 mm pitch): 0.3 mm; the heavy
  # load (boost, ~1 A at 2.5 W / 3.0 V) is ~20 mm from J1 -> ~33 mOhm / 33 mV; other VSYS loads < 0.5 A.
  net_widths: {BST_SW: 0.3, AMP_5V: 0.3, VSYS: 0.3}
  route_passes: 10
  stitch_pitch: 2.5      # denser GND stitching ties the narrow pour fingers between dense signal runs
  route_first: [AUDIO_P, AUDIO_N, AMP_INP_C, AMP_INN_C, AMP_INP, AMP_INN]

