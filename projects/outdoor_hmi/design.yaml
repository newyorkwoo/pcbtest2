    - {item: "Haptic driver 型號", source: "TI DRV2605LEVM 等級", design: "DRV2605L IC", reason: "DRV2605LEVM 是評估板，量產用其上的 DRV2605L 晶片"}
    - {item: "消滅離散邏輯 / 協同 MCU", source: "按鍵、解碼與狀態判斷收斂到一顆寬溫協同 MCU，或直接進主板 AP", design: "旋鈕直通 AP；按鍵經 TCA9554 I2C 鍵盤晶片；SOS 長按保留 RC + 74AUP1G17", reason: "採原文允許的「主板 AP 硬體中斷 / I2C 鍵盤晶片」選項，不另加 MCU（免韌體）；SOS 硬體長按延時是原文另一條明確要求"}
    - {item: "喇叭功率匹配", source: "整機規格 2 W 喇叭；功放 2.5～3 W", design: "功放最大 2.5 W / 4 Ω，J4 標示 4 Ω 2.5 W 喇叭", reason: "待決：選用 ≥2.5 W 喇叭，或韌體限制最大音量，避免燒喇叭"}
    - {item: "100 dB 警報聲壓", source: "2 W 喇叭最大功率 100 dB", design: "電路可輸出 2.5 W", reason: "待決：100 dB @1 m 需喇叭靈敏度 ≥ 約 96 dB @1 W/1 m，選型時確認"}
    - {item: "第 5 顆按鍵功能", source: "列出返回、選單、Fn、Waymark 四種功能", design: "第 5 顆暫定 PAGE（翻頁）", reason: "待決：確認第 5 顆按鍵用途"}
    - {item: "SOS 鍵機構", source: "頂部、亮橘色微凹、實體防誤觸掀蓋", design: "SW7 C&K KSC 置於板頂邊，橘色鍵帽、掀蓋由機構提供", reason: "掀蓋與鍵帽屬機構設計，需與外殼一起驗證"}
  constraints:
    - "Board 2 為 2 層板；所有 RF（GNSS、DAB+、FRS）在 Board 1 的 ≥4 層板上"
    - "80 × 48 mm，板厚 1.0 mm；只透過一條 26 pin 0.5 mm FPC 與 Board 1 連接"
    - "標準匯流排（I2C，3.3 V，400 kHz）架構"
    - "整機重量 200 g、預算約 US$600"
  out_of_scope:
    - "Board 1：AP、GNSS、DAB+/FM、FRS/APRS、PMIC 與充電、螢幕、感測器、儲存、藍牙 / Wi-Fi"
    - "外殼、旋鈕、按鍵帽、SOS 掀蓋與防水結構"
    - "韌體（鬧鐘、音量漸強、時區、地圖、多國語系）"
  acceptance:
    - "ERC 0 錯誤、DRC 0 錯誤 / 0 未連接"
    - "全部 SPICE 模擬 PASS"
    - "AI 設計審核 PASS（目前 CONDITIONAL：EC12D 焊腳需試裝確認）"
    - "打樣板在 −40 / +25 / +85 °C 通過 FR-01 ~ FR-13"
    - "SOS 警報聲壓 ≥ 100 dB @1 m（裝上選定喇叭）"
    - "差異表中的「待決」項目全部有結論"

# Device description + spec sheet shown next to the schematic in the GUI (原理圖 → 電路說明 / 規格書).
spec:
  summary: >-
    戶外多功能主機（Outdoor Hub）的第 2 片板：人機介面與警報板。提供 5 顆防水按鍵、旋轉編碼器（含按壓）、
    帶硬體 3 秒長按判定的 SOS 鍵、SOS 閃光 LED、兩顆 LRA 線性馬達的觸覺回饋，以及 2.5 W 喇叭擴大機。
    透過 26 pin FPC 接到第 1 片板（AP、GNSS、DAB+/FM、FRS/APRS、電源管理、顯示器），工作溫度 −40～+85 °C。
  blocks:
    fpc:
      title: "FPC 連接到主板（Board 1）"
      text: >-
        J1 Hirose FH12 26 pin 0.5 mm FPC。VSYS 用 4 個接點（2 A 預算）、GND 7 個接點；+3V3 是主板常開的邏輯電源。
        所有從主板來的輸入在本板都有安全預設的上/下拉電阻，主板沒上電時本板保持安靜（靜音、升壓關、馬達關、LED 關）。
    i2c:
      title: "I2C 與通道切換"
      text: "R1/R2 4.7 kΩ 匯流排上拉（主板已有上拉時可不焊）。U3 TCA9546A（0x70）I2C 開關：兩顆 DRV2605L 位址同為 0x5A，各放在不同通道（CH0 = A、CH1 = B）。"
    keys:
      title: "前面板按鍵"
      text: >-
        5 顆 C&K KSC 密封（IP67）按鍵：BACK、MENU、FN、MARK（標記航點）、PAGE，按下接地。每顆經 10 kΩ 上拉 → 100 kΩ 串聯 → 10 nF
        （τ ≈ 1 ms 去彈跳兼濾射頻）進 U4 TCA9554（0x21）擴充 IO；TCA9554 的 ~INT 拉低 KEY_INT_N 喚醒主機。D1 SP0504 TVS 防靜電。
    encoder:
      title: "旋轉編碼器"
      text: "SW6 EC12D（15 脈衝 / 30 段 + 按壓）。A/B/按壓直接送主機（計時器正交解碼 ×4），採 Bourns 建議的 10 kΩ 上拉 / 10 kΩ 串聯 / 10 nF 濾波；D2 TVS 防靜電。"
    sos:
      title: "SOS 鍵與 3 秒長按判定"
      text: >-
        SW7 按下接 +3V3。SOS_PRESS（1 kΩ + 10 nF）立即通知主機；同時經 910 kΩ 對 4.7 µF 充電，約 3 秒後越過 U5 74AUP1G17 施密特門檻，
        輸出 SOS_LONG 獨立喚醒主機（模擬 01）。放開時 D5 1N4148 立刻放電，短按不會累積。D3 TVS 防靜電。
    led:
      title: "SOS 閃光燈"
      text: "D4 紅色 2835 0.5 W LED，由 Q1 DMG2302U 開關、主機 PWM 控制（摩斯碼）；R37/R38 兩顆 33 Ω 並聯限流，約 95～150 mA（模擬 03）。"
    haptic_a:
      title: "觸覺回饋 A"
      text: "U1 DRV2605L 閉迴路 LRA 驅動（自動追蹤共振頻率、自動校正，補償溫度漂移），VDD = VSYS；馬達接 J2 JST-SH 2 pin。"
    haptic_b:
      title: "觸覺回饋 B"
      text: "U2 DRV2605L 同 A；兩顆的 IN/TRIG 共用 HAPTIC_TRIG，同一個邊緣同時觸發，左右對稱震動。馬達接 J3。"
    boost:
      title: "5 V 升壓"
      text: >-
        3.0～4.35 V 電池無法對 4 Ω 輸出 2.5 W，所以 U6 TPS61022 把 VSYS 升到 AMP_5V = 5.0 V（732 kΩ / 100 kΩ 回授）。
        BOOST_EN 低電位時真正斷開輸出，擴大機完全斷電。
    amp:
      title: "2.5 W 擴大機"
      text: >-
        U7 PAM8302A 以 5 V 推 4 Ω / 2.5 W 喇叭。差動輸入經 100 nF 隔直 → 10 kΩ → 100 pF：高通約 80 Hz 保護小喇叭、
        低通濾掉 FRS 467 MHz 干擾（模擬 02）。無濾波輸出每腳加磁珠 + 470 pF，避免干擾 GNSS / DAB 天線。AMP_SD_N 為硬體靜音。
    mechanical:
      title: "固定孔"
      text: "四個 M2 螺絲固定孔。"
  sections:
    "產品概要 Overview":
      用途: "戶外多功能主機的人機介面與警報板（Board 2 of 2）"
      工作溫度: "−40～+85 °C（全部 IC 為工業級；電阻 AEC-Q200；無 X5R 電容）"
      防護: "三防漆（IPC-CC-830），FPC 接點、按鍵、編碼器、JST 接點避開"
      連接: "26 pin 0.5 mm FPC 到 Board 1"
    "電源 Power":
      VSYS: "3.0～4.35 V（1S 鋰電池，由 Board 1 供應），FPC 4 接點，2 A 預算"
      +3V3: "Board 1 常開邏輯電源（擴充 IO、I2C 開關、SOS 計時、上拉）"
      AMP_5V: "TPS61022 升壓 5.0 V（4.87～5.12 V），BOOST_EN 控制、關閉時真正斷電"
      最大負載: "SOS 全開：擴大機約 1.1 A + LED 0.14 A + 兩顆 LRA 約 0.2 A（取自 VSYS）"
    "操作介面 Controls":
      按鍵: "5 顆 IP67 按鍵（BACK / MENU / FN / MARK / PAGE），RC 去彈跳 τ ≈ 1 ms，經 TCA9554 + 中斷"
      編碼器: "EC12D 15 脈衝 / 30 段 + 按壓，RC 濾波 τ ≈ 0.1 ms（模擬 04）"
      SOS 鍵: "即時 SOS_PRESS + 硬體長按 SOS_LONG（約 3 秒，模擬 01）"
      ESD: "所有按鍵 / 編碼器線上 SP0504BAHT TVS"
    "輸出 Outputs":
      喇叭: "PAM8302A，4 Ω / 2.5 W @ 5 V，高通約 80 Hz、射頻抑制（模擬 02）"
      觸覺: "2 × DRV2605L LRA 閉迴路驅動，同步觸發"
      SOS 燈: "紅色 0.5 W LED，PWM 摩斯碼，約 95～150 mA（模擬 03）"
    "I2C (3.3 V, 400 kHz)":
      位址: ["0x21 TCA9554 按鍵擴充 IO", "0x70 TCA9546A I2C 開關", "0x5A DRV2605L ×2（各在 TCA9546A CH0 / CH1）"]
      上拉: "4.7 kΩ（Board 1 已有上拉時不焊 R1/R2）"

board:
  width: 80
  height: 48
  corner_radius: 3
  layers: 2
  thickness: 1.0
  fab: jlcpcb

rules:
  track: 0.15
  power_track: 0.4
  clearance: 0.15
  via: [0.6, 0.3]
  grid: 0.1
  edge_clearance: 0.4
  part_spacing: 0.4
  # LRA leads stay at 0.2 mm: DRV2605L LRA drive is < 0.1 A rms
  power_nets: [VSYS, AMP_5V, BST_SW, AMP_OUTP, AMP_OUTN, SPK_P, SPK_N, LED_K, LED_D]
  # TPS61022 SW/VOUT pads are 0.2/0.35 mm tall: 0.4 mm cannot enter them, 0.3 mm can (BST_SW is 2 mm long;
  # AMP_5V ~0.7 A avg, 1.1 A peak at 2.5 W). VSYS lands on 0.3 mm FPC pads (0.5 mm pitch): 0.3 mm; the heavy
  # load (boost, ~1 A at 2.5 W / 3.0 V) is ~20 mm from J1 -> ~33 mOhm / 33 mV; other VSYS loads < 0.5 A.
  net_widths: {BST_SW: 0.3, AMP_5V: 0.3, VSYS: 0.3}
  route_passes: 10
  stitch_pitch: 2.5      # denser GND stitching ties the narrow pour fingers between dense signal runs
  route_first: [AUDIO_P, AUDIO_N, AMP_INP_C, AMP_INN_C, AMP_INP, AMP_INN]

custom_footprints:
  lib: aipcb_custom
  parts:
    Alps_EC12D_Switch_Vertical:
      type: tht
      description: "Alps EC12D (push-on switch, vertical) PC-board holes per Alps catalog p.289 drawing No.5, viewed from mounting side. Origin = shaft centre. A/B 11.1 apart, A-C 8.3, D (5.95, 3.45), E 6.85 above centre, 5x d1.05 holes; lugs 2.05 x 2.15 at 13.3 outer span. Re-verified 2026-11-13 against the Alps EC12E/EC12D catalog sheet (drawing No.5, all hole coordinates match); body 12.5 x 11.7 per the same sheet. Lug holes are drawn rectangular, here oval 2.05 x 2.15: check the lug fit on the 1:1 print."
      courtyard: [-7.4, -8.3, 7.4, 7.0]
      body: [-6.25, -5.85, 6.25, 5.85]
      pads:
        - {number: A,  x: -5.55, y: -4.15, drill: 1.05, size: 1.7}
        - {number: B,  x: 5.55,  y: -4.15, drill: 1.05, size: 1.7}
        - {number: C,  x: -5.55, y: 4.15,  drill: 1.05, size: 1.7}
        - {number: S2, x: 5.95,  y: 3.45,  drill: 1.05, size: 1.7}
        - {number: S1, x: 0.0,   y: -6.85, drill: 1.05, size: 1.7}
        - {number: MP, x: -5.625, y: 0.0, drill: [2.05, 2.15], size: [2.75, 2.85], shape: rect}
        - {number: MP, x: 5.625,  y: 0.0, drill: [2.05, 2.15], size: [2.75, 2.85], shape: rect}
    LED_Broadcom_2835_DFN2:
      type: pads
      description: "Broadcom CSMW-Lx00 0.5 W 2835 DFN2 recommended land pattern (datasheet Fig.12): 4.50 total, anode pad 2.49 x 2.10, cathode pad 1.42 x 2.10, gap 0.59. Pad 2 = A (large, heat), pad 1 = K - matches Device:LED. Re-verified 2026-11-13 against CSMW-Lx00-AxxxE-DS100 Fig.1 (anode = wide 2.06 terminal) and Fig.12."
      courtyard: [-2.5, -1.65, 2.5, 1.65]
      body: [-1.75, -1.4, 1.75, 1.4]
      pads:
        - {number: 2, x: -1.005, y: 0, size: [2.49, 2.10], smd: true}
        - {number: 1, x: 1.54, y: 0, size: [1.42, 2.10], smd: true}

